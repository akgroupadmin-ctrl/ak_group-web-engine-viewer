<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Engine Viewer</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #111;
}
</style>

<!-- СТАБИЛЬНАЯ ВЕРСИЯ THREE -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

</head>

<body>

<script>
// сцена
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);

// камера
const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 1, 5);

// рендер
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// свет
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x111111, 1.2);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(0xffffff, 2);
keyLight.position.set(5, 5, 5);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xff0000, 1.5);
fillLight.position.set(-5, 2, -5);
scene.add(fillLight);

const redLight = new THREE.PointLight(0xff2a2a, 3, 10);
redLight.position.set(2, 2, 2);
scene.add(redLight);

// загрузка модели
const loader = new THREE.GLTFLoader();

 loader.load(
  'https://akgroupadmin-ctrl.github.io/ak_group-web-engine-viewer/turbine__turbofan_engine__jet_engine.glb',

  function (gltf) {

    const model = gltf.scene; // ← ВАЖНО

    // 🔴 перекраска
    model.traverse((child) => {
      if (child.isMesh && child.material) {

        if (child.material.color && child.material.color.r > 0.6) {
          child.material.color.set(0xff2a2a);
        }

        child.material.emissive = new THREE.Color(0x220000);
        child.material.emissiveIntensity = 0.4;
      }
    });

    scene.add(model); // ← не забудь!

  }
);
  
    // центрирование
    const box = new THREE.Box3().setFromObject(model);
    const center = new THREE.Vector3();
    box.getCenter(center);
    model.position.sub(center);

    // масштаб
    model.scale.set(3, 3, 3);

    scene.add(model);

    console.log("MODEL LOADED ✅");
  },

  undefined,

  function (error) {
    console.error("LOAD ERROR ❌", error);
  }
);

// управление
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1;

// анимация
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// адаптация под экран
window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
