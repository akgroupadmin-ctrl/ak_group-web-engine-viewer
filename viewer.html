<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Engine Viewer</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #111;
}
</style>

<!-- СТАБИЛЬНАЯ ВЕРСИЯ THREE -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

</head>

<body>

<script>
// сцена
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

// камера
const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 1, 5);

// рендер
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// свет
const light1 = new THREE.HemisphereLight(0xffffff, 0x444444, 2);
scene.add(light1);

const light2 = new THREE.DirectionalLight(0xffffff, 2);
light2.position.set(5, 5, 5);
scene.add(light2);

// загрузка модели
const loader = new THREE.GLTFLoader();
loader.load(
  'https://raw.githubusercontent.com/akgroupadmin-ctrl/ak_group-web-engine-viewer/main/engine.glb',

  function (gltf) {
    const model = gltf.scene;

    // центрирование
    const box = new THREE.Box3().setFromObject(model);
    const center = new THREE.Vector3();
    box.getCenter(center);
    model.position.sub(center);

    // масштаб
    model.scale.set(3, 3, 3);

    scene.add(model);

    console.log("MODEL LOADED ✅");
  },

  undefined,

  function (error) {
    console.error("LOAD ERROR ❌", error);
  }
);

// управление
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1;

// анимация
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// адаптация под экран
window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
